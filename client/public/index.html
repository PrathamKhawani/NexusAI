<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- === NOVAAI BASE SEO === -->
    <title>NovaAI — The Neural Intelligence Hub</title>
    <meta name="description" content="NovaAI is an AI-native intelligence platform for discovering cutting-edge AI tools, reading the latest tech news, earning XP, and building your AI expertise. Built on MERN stack." />
    <meta name="keywords" content="AI tools, artificial intelligence, machine learning, LLM, GPT, AI news, neural networks, NovaAI, AI platform, deep learning, tech intelligence" />
    <meta name="author" content="NovaAI" />
    <meta name="application-name" content="NovaAI" />
    <meta name="generator" content="NovaAI MERN Stack v2.0" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#00f5ff" />
    <meta name="color-scheme" content="dark" />

    <!-- === OPEN GRAPH === -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NovaAI" />
    <meta property="og:title" content="NovaAI — The Neural Intelligence Hub" />
    <meta property="og:description" content="Discover AI tools, read frontier AI news, track your XP, and bookmark your favorite AI resources. The premier AI-native MERN platform." />
    <meta property="og:url" content="https://novaai.app" />
    <meta property="og:image" content="https://novaai.app/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NovaAI — Neural Intelligence Hub" />
    <meta property="og:locale" content="en_US" />

    <!-- === TWITTER CARDS === -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NovaAI — The Neural Intelligence Hub" />
    <meta name="twitter:description" content="Discover AI tools, read AI news, earn XP, and build your AI knowledge. MERN-powered AI platform." />
    <meta name="twitter:image" content="https://novaai.app/og-cover.png" />
    <meta name="twitter:image:alt" content="NovaAI" />

    <!-- === CANONICAL === -->
    <link rel="canonical" href="https://novaai.app" />

    <!-- === JSON-LD: WebSite Schema === -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "NovaAI",
      "url": "https://novaai.app",
      "description": "The Neural Intelligence Hub — discover AI tools, read AI news, and track your AI learning journey.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://novaai.app/news?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- === JSON-LD: Organization Schema === -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "NovaAI",
      "url": "https://novaai.app",
      "logo": {
        "@type": "ImageObject",
        "url": "https://novaai.app/logo192.png",
        "width": 192,
        "height": 192
      },
      "description": "NovaAI is an AI-native intelligence platform built on the MERN stack.",
      "sameAs": []
    }
    </script>

    <!-- === ICONS === -->
    <link rel="icon" href="%PUBLIC_URL%/logo_nexus.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo_nexus.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- === PERFORMANCE === -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="//localhost:5000" />
  </head>
  <body>
    <noscript>
      <p>NovaAI requires JavaScript to run. Please enable JavaScript in your browser to access the Neural Intelligence Hub.</p>
    </noscript>
    <div id="root"></div>
  </body>
</html>
